[project]
name = "superresolution"
version = "0.1.0"
description = "PyTorch super-resolution (ESPCN/EDSR + PixelShuffle) with versioned ESP32 camera degradation"
readme = "README.md"
authors = [
    { name = "fcynice", email = "Fcynice@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.143.2",
    "lxml>=6.1.3",
    "numpy>=2.0",
    "pillow>=11.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
superresolution = "superresolution:main"
train-sr = "superresolution.train:main"
infer-sr = "superresolution.infer:main"
degrade-sr = "superresolution.degrade.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Use CUDA 13.0 GPU wheels on Linux/Windows; fall back to PyPI (CPU) on macOS.
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
